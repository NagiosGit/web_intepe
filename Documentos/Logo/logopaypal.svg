<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="paypalCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="paypalCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#FF7120" />
    </linearGradient>
  </defs>

  <!-- 1. Ambient Cyan/Blue Outer Glow -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#00D2FF" stroke-width="6" opacity="0.4" filter="url(#paypalCyanGlow)" />

  <!-- 2. Main Circular Body: Pure White -->
  <circle cx="256" cy="256" r="236" fill="#FFFFFF" stroke="#00B4F0" stroke-width="8" />

  <!-- 3. Inner Tech Orbit Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#00B4F0" stroke-width="1.5" opacity="0.4" />

  <!-- Crosshair Ticks -->
  <line x1="256" y1="20" x2="256" y2="38" stroke="#00A0EB" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="492" x2="256" y2="474" stroke="#00A0EB" stroke-width="4" stroke-linecap="round" />
  <line x1="20" y1="256" x2="38" y2="256" stroke="#00A0EB" stroke-width="4" stroke-linecap="round" />
  <line x1="492" y1="256" x2="474" y2="256" stroke="#00A0EB" stroke-width="4" stroke-linecap="round" />

  <!-- 4. Large Microchip Pins (16 pins: 4 per side) -->
  <g stroke="#FF7120" stroke-width="8" stroke-linecap="round">
    <!-- TOP PINS -->
    <line x1="172" y1="172" x2="172" y2="122" />
    <line x1="228" y1="172" x2="228" y2="122" />
    <line x1="284" y1="172" x2="284" y2="122" />
    <line x1="340" y1="172" x2="340" y2="122" />

    <!-- BOTTOM PINS -->
    <line x1="172" y1="340" x2="172" y2="390" />
    <line x1="228" y1="340" x2="228" y2="390" />
    <line x1="284" y1="340" x2="284" y2="390" />
    <line x1="340" y1="340" x2="340" y2="390" />

    <!-- LEFT PINS -->
    <line x1="172" y1="172" x2="122" y2="172" />
    <line x1="172" y1="228" x2="122" y2="228" />
    <line x1="172" y1="284" x2="122" y2="284" />
    <line x1="172" y1="340" x2="122" y2="340" />

    <!-- RIGHT PINS -->
    <line x1="340" y1="172" x2="390" y2="172" />
    <line x1="340" y1="228" x2="390" y2="228" />
    <line x1="340" y1="284" x2="390" y2="284" />
    <line x1="340" y1="340" x2="390" y2="340" />
  </g>

  <!-- CYAN CONNECTION NODES -->
  <g fill="#00D2FF">
    <circle cx="172" cy="122" r="7.5" />
    <circle cx="228" cy="122" r="7.5" />
    <circle cx="284" cy="122" r="7.5" />
    <circle cx="340" cy="122" r="7.5" />

    <circle cx="172" cy="390" r="7.5" />
    <circle cx="228" cy="390" r="7.5" />
    <circle cx="284" cy="390" r="7.5" />
    <circle cx="340" cy="390" r="7.5" />

    <circle cx="122" cy="172" r="7.5" />
    <circle cx="122" cy="228" r="7.5" />
    <circle cx="122" cy="284" r="7.5" />
    <circle cx="122" cy="340" r="7.5" />

    <circle cx="390" cy="172" r="7.5" />
    <circle cx="390" cy="228" r="7.5" />
    <circle cx="390" cy="284" r="7.5" />
    <circle cx="390" cy="340" r="7.5" />
  </g>

  <!-- 5. Large Chip Chassis (Dark Navy #0F172A) -->
  <rect x="136" y="136" width="240" height="240" rx="34" ry="34" fill="#0F172A" stroke="#FF7120" stroke-width="8" />

  <!-- 6. Solid Orange Silicon Core -->
  <rect x="188" y="188" width="136" height="136" rx="20" ry="20" fill="url(#paypalCoreGrad)" stroke="#FF8A3D" stroke-width="2" />
</svg>
